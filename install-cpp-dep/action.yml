name: Install C++ cucumber dependency
description: >-
  Checks out a cucumber C++ sub-project at a given ref, builds it with the
  host-system CMake workflow preset and installs it so downstream projects can
  find it via find_package().

inputs:
  dependency:
    description: "File containing a fully qualified reference to a GitHub repository (e.g. cucumber/messages@e5769e89dd8dd7aa7e8c8163023f38bad539e3aa # v34.2.1)"
    required: true
  path:
    description: >-
      Directory the repository is checked out into. Defaults to the repository
      name with a "-src" suffix (e.g. messages-src).
    required: false
    default: ""
  preset:
    description: "CMake workflow preset used to build the dependency."
    required: false
    default: host-system
  working-directory:
    description: "Using the working-directory keyword, you can specify the working directory of where to run the command."
    required: true

runs:
  using: composite
  steps:
    # Resolve contents of dependencies/<name>.version file and
    # derive a default checkout path (<name>-src) when none is supplied.
    - name: Resolve dependencies and checkout path
      id: resolve
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        INPUT_DEPENDENCY: ${{ inputs.dependency }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_PATH: ${{ inputs.path }}
      run: |
        if [ ! -f "$INPUT_DEPENDENCY" ]; then
          printf '%s does not exist in %s\n' "$INPUT_DEPENDENCY" "$INPUT_WORKING_DIRECTORY" >&2
          exit 1
        fi
        
        if ! reference=$(cat -- "$INPUT_DEPENDENCY" | grep -E "[0-9a-z]+/[0-9a-z]+@[0-9a-z]{40}( #.*)?"); then
          printf '%s does not contain a valid reference\n' "$INPUT_DEPENDENCY" >&2
          exit 1
        fi
        
        repository=$(printf '%s\n' "$reference" | cut -d '@' -f 1)
        ref=$(printf '%s\n' "$reference" | cut -d '@' -f 2 | cut -d ' ' -f 1)
        
        if [ -n "$INPUT_PATH" ]; then
          path=$INPUT_PATH
        else
          path=${repository##*/}-src
        fi

        for value in "$repository" "$ref" "$path"; do
          if [[ "$value" == *$'\r'* || "$value" == *$'\n'* ]]; then
            printf '%s\n' 'Resolved repository, ref and path must not contain CR or LF.' >&2
            exit 1
          fi
        done

        printf 'repository=%s\nref=%s\npath=%s\n' "$repository" "$ref" "$path" >> "$GITHUB_OUTPUT"
    - name: Checkout ${{ inputs.repository }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ steps.resolve.outputs.repository }}
        ref: ${{ steps.resolve.outputs.ref }}
        path: ${{ steps.resolve.outputs.path }}
        persist-credentials: false

    # Linux/macOS: install into a system prefix, which requires elevation.
    - name: Build and install (Unix)
      if: runner.os != 'Windows'
      shell: bash
      working-directory: ${{ steps.resolve.outputs.path }}/cpp
      env:
        INPUT_PRESET: ${{ inputs.preset }}
      run: |
        cmake --workflow --preset "$INPUT_PRESET"
        sudo cmake --install "build/$INPUT_PRESET"

    # Windows: no sudo; the vcpkg/default prefix is user-writable.
    - name: Build and install (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      working-directory: ${{ steps.resolve.outputs.path }}/cpp
      env:
        INPUT_PRESET: ${{ inputs.preset }}
      run: |
        $workflowArgs = @('--workflow', '--preset', $env:INPUT_PRESET)
        & cmake @workflowArgs
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $installArgs = @('--install', ('build/' + $env:INPUT_PRESET))
        & cmake @installArgs
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
